<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reading Corner 📖</title>
    <style>
        :root {
            --powder-pink: #F3D7E2;
            --cream-bg: #FFF8F0;
            --text-dark: #4A3E40;
            --text-muted: #8A7A7C;
            --accent-pink: #EAA9C3;
        }

        body {
            font-family: Georgia, Cambria, "Times New Roman", Times, serif;
            background-color: transparent;
            margin: 0;
            padding: 8px;
            display: flex;
            justify-content: center;
        }

        .widget-container {
            width: 100%;
            max-width: 480px;
            background-color: var(--cream-bg);
            border: 1px solid rgba(243, 215, 226, 0.4);
            border-radius: 20px;
            padding: 24px;
            box-sizing: border-box;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.01);
        }

        .header-title {
            font-size: 1.4rem;
            font-weight: normal;
            font-style: italic;
            color: var(--text-dark);
            margin: 0 0 20px 0;
            text-align: center;
        }

        /* Reading Focus Tracker Session Display Container */
        .timer-box {
            background-color: #ffffff;
            border-radius: 12px;
            padding: 12px;
            text-align: center;
            border: 1px solid rgba(243, 215, 226, 0.3);
            margin-bottom: 20px;
        }

        .timer-title {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .timer-display {
            font-size: 1.4rem;
            font-weight: bold;
            color: var(--text-dark);
            margin-bottom: 8px;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        }

        .btn-timer {
            background-color: var(--powder-pink);
            border: none;
            border-radius: 8px;
            padding: 6px 16px;
            font-family: inherit;
            font-size: 0.85rem;
            color: var(--text-dark);
            cursor: pointer;
            font-weight: bold;
        }
        .btn-timer.active { background-color: var(--accent-pink); color: white; }

        /* Dynamic Book Overview Presentation Grid Layout */
        .book-layout-card {
            display: flex;
            gap: 20px;
            background: #ffffff;
            padding: 16px;
            border-radius: 12px;
            border: 1px solid rgba(243, 215, 226, 0.2);
            align-items: center;
        }

        .cover-wrapper {
            width: 100px;
            height: 145px;
            background: #fcf6f8;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(0,0,0,0.05);
            flex-shrink: 0;
        }

        .cover-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .cover-placeholder {
            font-size: 2rem;
            opacity: 0.4;
        }

        .book-details-column {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .book-title-display {
            font-size: 1.15rem;
            font-weight: bold;
            color: var(--text-dark);
            margin: 0;
        }

        .progress-stats {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .slider {
            -webkit-appearance: none;
            width: 100%;
            height: 6px;
            border-radius: 4px;
            background: #f5f5f5;
            outline: none;
            margin: 4px 0;
        }

        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--accent-pink);
            cursor: pointer;
        }

        /* Compact Setup Input Form container blocks */
        .setup-panel {
            margin-top: 20px;
            border-top: 1px solid rgba(74, 62, 64, 0.08);
            padding-top: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .input-row { display: flex; gap: 8px; }
        
        input {
            border: 1px solid #ebd6da;
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 0.85rem;
            font-family: inherit;
            color: var(--text-dark);
            outline: none;
            background: #ffffff;
            box-sizing: border-box;
        }
        .input-title { flex: 2; }
        .input-pages { flex: 1; text-align: center; }
        .input-url { width: 100%; }

        .btn-update {
            background: var(--powder-pink);
            border: none;
            border-radius: 8px;
            padding: 8px 16px;
            font-family: inherit;
            font-size: 0.85rem;
            font-weight: bold;
            color: var(--text-dark);
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="widget-container">
    <h1 class="header-title">📖 Reading Corner</h1>

    <div class="timer-box">
        <div class="timer-title">⏱️ Reading Focus Session</div>
        <div class="timer-display" id="timeDisplay">00:00</div>
        <button class="btn-timer" id="timerBtn" onclick="toggleTimer()">Start Session</button>
    </div>

    <!-- Layout display split grid matching requirements -->
    <div class="book-layout-card">
        <div class="cover-wrapper" id="coverContainer">
            <span class="cover-placeholder">📖</span>
        </div>
        
        <div class="book-details-column">
            <h2 class="book-title-display" id="bookTitle">Loading...</h2>
            
            <div style="display: flex; flex-direction: column; gap: 4px;">
                <div class="progress-stats">
                    <span id="pageProgress">Page 0 of 0</span>
                    <span id="percentProgress" style="font-weight: bold; color: var(--accent-pink);">0%</span>
                </div>
                <input type="range" min="0" max="100" value="0" class="slider" id="progressSlider" oninput="updateSliderProgress(this.value)">
            </div>
        </div>
    </div>

    <!-- Expanded inputs to accommodate customizable attributes mapping -->
    <div class="setup-panel">
        <div class="input-row">
            <input type="text" id="newTitle" class="input-title" placeholder="Book title...">
            <input type="number" id="newPages" class="input-pages" placeholder="Pages">
        </div>
        <input type="text" id="newCoverUrl" class="input-url" placeholder="Paste book cover Image URL here...">
        <button class="btn-update" onclick="changeBook()">Set New Book ➔</button>
    </div>
</div>

<script>
    let bookData = JSON.parse(localStorage.getItem('notion_book_with_cover')) || {
        title: "Influence",
        totalPages: 320,
        currentPage: 28,
        coverUrl: ""
    };

    let timerSeconds = 0;
    let timerInterval = null;
    let isTimerRunning = false;

    function renderBook() {
        localStorage.setItem('notion_book_with_cover', JSON.stringify(bookData));
        
        document.getElementById('bookTitle').innerText = bookData.title;
        
        const slider = document.getElementById('progressSlider');
        slider.max = bookData.totalPages;
        slider.value = bookData.currentPage;

        const percent = Math.round((bookData.currentPage / bookData.totalPages) * 100) || 0;
        document.getElementById('pageProgress').innerText = `Page ${bookData.currentPage} of ${bookData.totalPages}`;
        document.getElementById('percentProgress').innerText = `${percent}%`;

        // Manage dynamic cover frame layout content updates
        const coverContainer = document.getElementById('coverContainer');
        if (bookData.coverUrl && bookData.coverUrl.trim().startsWith('http')) {
            coverContainer.innerHTML = `<img src="${bookData.coverUrl}" class="cover-image" alt="Book Cover">`;
        } else {
            coverContainer.innerHTML = `<span class="cover-placeholder">📖</span>`;
        }
    }

    function updateSliderProgress(val) {
        bookData.currentPage = parseInt(val);
        renderBook();
    }

    function changeBook() {
        const titleIn = document.getElementById('newTitle');
        const pagesIn = document.getElementById('newPages');
        const coverIn = document.getElementById('newCoverUrl');

        if (titleIn.value.trim()) bookData.title = titleIn.value.trim();
        if (pagesIn.value && parseInt(pagesIn.value) > 0) {
            bookData.totalPages = parseInt(pagesIn.value);
            bookData.currentPage = 0; 
        }
        // Save the cover source link configuration string
        bookData.coverUrl = coverIn.value.trim();

        titleIn.value = '';
        pagesIn.value = '';
        coverIn.value = '';
        renderBook();
    }

    function toggleTimer() {
        const btn = document.getElementById('timerBtn');
        if (isTimerRunning) {
            clearInterval(timerInterval);
            btn.innerText = "Start Session";
            btn.classList.remove('active');
            isTimerRunning = false;
        } else {
            isTimerRunning = true;
            btn.innerText = "Pause Session";
            btn.classList.add('active');
            timerInterval = setInterval(() => {
                timerSeconds++;
                const mins = String(Math.floor(timerSeconds / 60)).padStart(2, '0');
