<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currently Reading Glass Sidebar 🤍</title>

    <!-- Google Fonts: Alice Serif -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alice&display=swap" rel="stylesheet">

    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.88);
            --glass-border: rgba(254, 225, 231, 0.85);
            --glass-shadow: 0 8px 24px rgba(180, 150, 160, 0.10), 0 2px 6px rgba(0, 0, 0, 0.03);

            --text-dark: #332327;
            --text-subtle: #7A6A6D;

            /* Soft Pink & Berry Palette */
            --pink-accent-bg: #FEE1E7;
            --pink-accent-border: #F9CAD4;
            --berry-text: #7D2D3E;

            /* Card Elements */
            --card-bg: rgba(255, 255, 255, 0.75);
            --card-border: rgba(245, 230, 233, 0.95);
            --input-bg: rgba(255, 255, 255, 0.98);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Alice', Georgia, serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 4px;
            background: transparent;
            color: var(--text-dark);
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
            width: 100%;
        }

        /* Glass Widget Sidebar Card Container */
        .glass-widget-card {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 320px;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 12px 12px;
            box-shadow: var(--glass-shadow);
            margin: 0 auto;
        }

        /* Compact Header Row */
        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(245, 225, 228, 0.7);
            padding-bottom: 8px;
            margin-bottom: 10px;
            gap: 4px;
        }

        .header-title {
            font-family: 'Alice', serif;
            font-size: 0.82rem;
            font-weight: 600;
            letter-spacing: 0.4px;
            text-transform: uppercase;
            color: var(--text-dark);
            display: flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
        }

        .heart-icon {
            font-size: 0.85rem;
            display: inline-block;
        }

        .edit-toggle-btn {
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid var(--card-border);
            border-radius: 7px;
            padding: 3px 7px;
            cursor: pointer;
            font-family: 'Alice', serif;
            font-size: 0.72rem;
            color: var(--text-subtle);
            transition: all 0.2s ease;
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            gap: 3px;
        }

        .edit-toggle-btn:hover {
            background: #ffffff;
            color: var(--berry-text);
            border-color: var(--pink-accent-border);
        }

        /* Compact Banner */
        .banner-pink {
            background-color: var(--pink-accent-bg);
            color: var(--berry-text);
            border: 1px solid var(--pink-accent-border);
            padding: 6px 10px;
            border-radius: 9px;
            font-size: 0.75rem;
            line-height: 1.25;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-weight: 600;
            gap: 4px;
        }

        .banner-subtitle {
            font-size: 0.68rem;
            opacity: 0.85;
            font-weight: 400;
            white-space: nowrap;
        }

        /* Book Main Card Box */
        .book-main-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 10px;
            transition: border-color 0.2s ease;
        }

        .book-main-container:hover {
            border-color: var(--pink-accent-border);
        }

        /* Top Row: Cover + Details */
        .book-top-row {
            display: flex;
            gap: 10px;
            align-items: center;
            width: 100%;
        }

        /* Compact Cover Wrapper */
        .book-cover-wrapper {
            width: 75px;
            height: 110px;
            flex-shrink: 0;
            border-radius: 6px;
            overflow: hidden;
            box-shadow: 0 4px 12px rgba(51, 35, 39, 0.12);
            background: var(--pink-accent-bg);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255, 255, 255, 0.7);
        }

        .book-cover-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Cover Placeholder */
        .cover-placeholder {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 6px;
            color: var(--berry-text);
            gap: 4px;
        }

        .cover-placeholder-icon {
            font-size: 1.4rem;
        }

        .cover-placeholder-text {
            font-size: 0.62rem;
            line-height: 1.1;
            font-weight: 600;
            word-break: break-word;
        }

        /* Book Info Column */
        .book-details-column {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-width: 0; /* Ensures proper text truncation */
        }

        .book-title-text {
            font-family: 'Alice', serif;
            font-size: 0.92rem;
            font-weight: 600;
            color: var(--text-dark);
            line-height: 1.2;
            margin-bottom: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .book-author-text {
            font-size: 0.74rem;
            color: var(--text-subtle);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 6px;
        }

        /* Page Count Row */
        .progress-meta-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
            gap: 4px;
        }

        .pages-count-badge {
            font-size: 0.7rem;
            color: var(--text-subtle);
            white-space: nowrap;
        }

        .pages-count-badge span {
            font-weight: 600;
            color: var(--text-dark);
        }

        .percentage-badge {
            font-size: 0.68rem;
            font-weight: 600;
            color: var(--berry-text);
            background: var(--pink-accent-bg);
            border: 1px solid var(--pink-accent-border);
            padding: 1px 5px;
            border-radius: 5px;
            white-space: nowrap;
        }

        /* Progress Bar */
        .progress-track {
            width: 100%;
            height: 7px;
            background: rgba(245, 225, 228, 0.6);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 5px;
            border: 1px solid rgba(249, 202, 212, 0.5);
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #F9CAD4 0%, #E89CAE 100%);
            border-radius: 10px;
            width: 0%;
            transition: width 0.4s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .pages-remaining-text {
            font-size: 0.68rem;
            color: var(--text-subtle);
            font-style: italic;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Grid Quick Action Buttons (Full width below book row) */
        .quick-updater-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            width: 100%;
            padding-top: 2px;
        }

        .quick-btn {
            font-family: 'Alice', serif;
            font-size: 0.74rem;
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid var(--pink-accent-border);
            color: var(--berry-text);
            border-radius: 7px;
            padding: 5px 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
            font-weight: 600;
            text-align: center;
            box-shadow: 0 1px 3px rgba(180, 150, 160, 0.06);
            white-space: nowrap;
        }

        .quick-btn:hover {
            background: var(--pink-accent-bg);
            border-color: var(--pink-accent-border);
            color: var(--berry-text);
            transform: translateY(-1px);
        }

        .quick-btn:active {
            transform: scale(0.97);
        }

        /* Inline Edit Panel Drawer */
        .edit-panel {
            display: none;
            margin-top: 10px;
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            padding: 10px;
            gap: 8px;
            flex-direction: column;
            animation: fadeIn 0.2s ease;
        }

        .edit-panel.active {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-3px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .edit-group {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .edit-label {
            font-size: 0.7rem;
            color: var(--text-subtle);
            font-weight: 600;
        }

        .edit-input {
            font-family: 'Alice', serif;
            font-size: 0.78rem;
            color: var(--text-dark);
            background: var(--input-bg);
            border: 1px solid var(--card-border);
            border-radius: 6px;
            padding: 5px 8px;
            outline: none;
            transition: border-color 0.2s ease;
            width: 100%;
        }

        .edit-input:focus {
            border-color: var(--pink-accent-border);
        }

        .edit-grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
        }

        .cover-upload-row {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .file-upload-btn {
            font-family: 'Alice', serif;
            font-size: 0.7rem;
            background: var(--pink-accent-bg);
            color: var(--berry-text);
            border: 1px solid var(--pink-accent-border);
            border-radius: 6px;
            padding: 5px 8px;
            cursor: pointer;
            white-space: nowrap;
        }

        .file-input-hidden {
            display: none;
        }

        .save-edit-btn {
            font-family: 'Alice', serif;
            font-size: 0.78rem;
            font-weight: 600;
            background: var(--pink-accent-bg);
            color: var(--berry-text);
            border: 1px solid var(--pink-accent-border);
            border-radius: 7px;
            padding: 7px;
            cursor: pointer;
            margin-top: 2px;
        }

        /* Toast Overlay */
        .toast-msg {
            position: absolute;
            bottom: -26px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(51, 35, 39, 0.92);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            color: #ffffff;
            font-size: 0.7rem;
            padding: 3px 10px;
            border-radius: 8px;
            opacity: 0;
            pointer-events: none;
            transition: all 0.25s ease;
            white-space: nowrap;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
        }

        .toast-msg.show {
            opacity: 1;
            bottom: -18px;
        }
    </style>
</head>
<body>

<div class="glass-widget-card">
    <!-- Compact Header with Edit Toggle -->
    <div class="header-row">
        <h1 class="header-title">
            CURRENTLY READING <span class="heart-icon">🤍</span>
        </h1>
        <button class="edit-toggle-btn" id="editToggleBtn" onclick="window.toggleEditPanel()">
            ✏️ Edit
        </button>
    </div>

    <!-- Pink Guidance Banner -->
    <div class="banner-pink">
        <span>🤍 Companion</span>
        <span class="banner-subtitle">Track steady progress</span>
    </div>

    <!-- Main Book Display Box -->
    <div class="book-main-container">
        <!-- Top Row: Cover & Details -->
        <div class="book-top-row">
            <!-- Left: Compact Cover Wrapper -->
            <div class="book-cover-wrapper" id="coverWrapper">
                <!-- Cover Image / Fallback SVG -->
            </div>

            <!-- Right: Book Metadata & Stats -->
            <div class="book-details-column">
                <div class="book-title-text" id="displayTitle">Atomic Habits</div>
                <div class="book-author-text" id="displayAuthor">by James Clear</div>

                <!-- Page Count & Percent Badge -->
                <div class="progress-meta-row">
                    <div class="pages-count-badge">
                        <span id="displayCurrentPage">185</span>/<span id="displayTotalPages">320</span> p
                    </div>
                    <div class="percentage-badge" id="displayPercent">58%</div>
                </div>

                <!-- Gradient Progress Bar -->
                <div class="progress-track">
                    <div class="progress-fill" id="progressFill" style="width: 58%;"></div>
                </div>

                <!-- Pages Remaining -->
                <div class="pages-remaining-text" id="displayRemaining">
                    135 pages remaining
                </div>
            </div>
        </div>

        <!-- Bottom Grid: Quick Increments (+10, +20) -->
        <div class="quick-updater-row">
            <button class="quick-btn" onclick="window.changePage(10)" title="Add 10 pages">+10 pages</button>
            <button class="quick-btn" onclick="window.changePage(20)" title="Add 20 pages">+20 pages</button>
        </div>
    </div>

    <!-- Inline Edit Drawer Panel -->
    <div class="edit-panel" id="editPanel">
        <div class="edit-group">
            <label class="edit-label">Book Title</label>
            <input type="text" class="edit-input" id="inputTitle" placeholder="Title..." />
        </div>

        <div class="edit-group">
            <label class="edit-label">Author Name</label>
            <input type="text" class="edit-input" id="inputAuthor" placeholder="Author..." />
        </div>

        <div class="edit-grid-2">
            <div class="edit-group">
                <label class="edit-label">Current Page</label>
                <input type="number" class="edit-input" id="inputCurrentPage" min="0" placeholder="0" />
            </div>
            <div class="edit-group">
                <label class="edit-label">Total Pages</label>
                <input type="number" class="edit-input" id="inputTotalPages" min="1" placeholder="100" />
            </div>
        </div>

        <div class="edit-group">
            <label class="edit-label">Cover Image URL / File</label>
            <div class="cover-upload-row">
                <input type="text" class="edit-input" id="inputCoverUrl" style="flex:1;" placeholder="https://..." />
                <button class="file-upload-btn" onclick="document.getElementById('fileInput').click()">Upload</button>
                <input type="file" id="fileInput" class="file-input-hidden" accept="image/*" onchange="window.handleFileUpload(event)" />
            </div>
        </div>

        <button class="save-edit-btn" onclick="window.saveBookEdits()">✨ Save Details</button>
    </div>

    <!-- Toast Overlay -->
    <div class="toast-msg" id="toastMsg">Progress updated ✨</div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    const STORAGE_KEY = 'notion_reading_sidebar_v1';

    // Default book state
    let bookData = {
        title: "Atomic Habits",
        author: "James Clear",
        currentPage: 185,
        totalPages: 320,
        coverUrl: "https://images-na.ssl-images-amazon.com/images/S/compressed.photo.goodreads.com/books/1655988385i/2767052.jpg"
    };

    let db = null;
    let auth = null;
    let userDocRef = null;

    const appId = typeof __app_id !== 'undefined' ? __app_id : 'reading-glass-sidebar';
    const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : null;
    const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;

    function safeLoadLocal() {
        try {
            const raw = localStorage.getItem(STORAGE_KEY);
            if (raw) {
                bookData = { ...bookData, ...JSON.parse(raw) };
            }
        } catch (e) {
            console.warn("LocalStorage restricted in iframe. Operating in-memory state.", e);
        }
    }

    function safeSaveLocal() {
        try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(bookData));
        } catch (e) {
            console.warn("Unable to write LocalStorage in iframe context.", e);
        }
    }

    async function saveState() {
        safeSaveLocal();
        if (db && userDocRef && auth?.currentUser) {
            try {
                await setDoc(userDocRef, {
                    bookData: bookData,
                    updatedAt: new Date().toISOString()
                }, { merge: true });
            } catch (err) {
                console.warn("Firestore save error:", err);
            }
        }
    }

    async function initFirebase() {
        if (!firebaseConfig) return;
        try {
            const app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            auth = getAuth(app);

            if (initialAuthToken) {
                await signInWithCustomToken(auth, initialAuthToken);
            } else {
                await signInAnonymously(auth);
            }

            const user = auth.currentUser;
            if (user) {
                userDocRef = doc(db, 'artifacts', appId, 'users', user.uid, 'data', 'currentlyReading');
                
                onSnapshot(userDocRef, (snapshot) => {
                    if (snapshot.exists()) {
                        const data = snapshot.data();
                        if (data.bookData) {
                            bookData = { ...bookData, ...data.bookData };
                            updateUI();
                        }
                    }
                }, (error) => {
                    console.warn("Firestore snapshot error:", error);
                });
            }
        } catch (e) {
            console.warn("Firebase initialization skipped. Using local state.", e);
        }
    }

    function updateUI() {
        // Text Fields
        document.getElementById('displayTitle').innerText = bookData.title || "Untitled Book";
        document.getElementById('displayAuthor').innerText = bookData.author ? `by ${bookData.author}` : "Unknown Author";

        // Page calculations
        const cur = Math.max(0, parseInt(bookData.currentPage) || 0);
        const total = Math.max(1, parseInt(bookData.totalPages) || 1);
        const validCur = Math.min(cur, total);

        const percent = Math.min(100, Math.round((validCur / total) * 100));
        const remaining = Math.max(0, total - validCur);

        document.getElementById('displayCurrentPage').innerText = validCur;
        document.getElementById('displayTotalPages').innerText = total;
        document.getElementById('displayPercent').innerText = `${percent}%`;
        document.getElementById('progressFill').style.width = `${percent}%`;

        if (percent === 100) {
            document.getElementById('displayRemaining').innerText = "🎉 Book completed!";
        } else {
            document.getElementById('displayRemaining').innerText = `${remaining} pages left`;
        }

        // Render Cover Wrapper
        const wrapper = document.getElementById('coverWrapper');
        wrapper.innerHTML = '';

        if (bookData.coverUrl && bookData.coverUrl.trim() !== '') {
            const img = document.createElement('img');
            img.className = 'book-cover-img';
            img.src = bookData.coverUrl;
            img.alt = bookData.title;

            img.onerror = () => {
                renderPlaceholderCover(wrapper, bookData.title);
            };

            wrapper.appendChild(img);
        } else {
            renderPlaceholderCover(wrapper, bookData.title);
        }
    }

    function renderPlaceholderCover(container, title) {
        container.innerHTML = `
            <div class="cover-placeholder">
                <span class="cover-placeholder-icon">📚</span>
                <span class="cover-placeholder-text">${escapeHtml(title || 'Reading')}</span>
            </div>
        `;
    }

    function escapeHtml(text) {
        return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    window.toggleEditPanel = function() {
        const panel = document.getElementById('editPanel');
        const btn = document.getElementById('editToggleBtn');
        const isActive = panel.classList.contains('active');

        if (isActive) {
            panel.classList.remove('active');
            btn.innerText = '✏️ Edit';
        } else {
            document.getElementById('inputTitle').value = bookData.title;
            document.getElementById('inputAuthor').value = bookData.author;
            document.getElementById('inputCurrentPage').value = bookData.currentPage;
            document.getElementById('inputTotalPages').value = bookData.totalPages;
            document.getElementById('inputCoverUrl').value = bookData.coverUrl;

            panel.classList.add('active');
            btn.innerText = '✖ Close';
        }
    };

    window.saveBookEdits = function() {
        const title = document.getElementById('inputTitle').value.trim();
        const author = document.getElementById('inputAuthor').value.trim();
        const curPage = parseInt(document.getElementById('inputCurrentPage').value) || 0;
        const totalPage = parseInt(document.getElementById('inputTotalPages').value) || 1;
        const coverUrl = document.getElementById('inputCoverUrl').value.trim();

        bookData.title = title || "Untitled Book";
        bookData.author = author;
        bookData.totalPages = Math.max(1, totalPage);
        bookData.currentPage = Math.min(bookData.totalPages, Math.max(0, curPage));
        bookData.coverUrl = coverUrl;

        saveState();
        updateUI();
        window.toggleEditPanel();
        showToast("Saved! ✨");
    };

    // Quick Increment (+10, +20)
    window.changePage = function(delta) {
        const total = Math.max(1, parseInt(bookData.totalPages) || 1);
        let cur = parseInt(bookData.currentPage) || 0;
        cur = Math.min(total, Math.max(0, cur + delta));

        bookData.currentPage = cur;
        saveState();
        updateUI();

        showToast(`+${delta} pages logged 📖`);
    };

    // File Upload Handler
    window.handleFileUpload = function(event) {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('inputCoverUrl').value = e.target.result;
                showToast("Cover attached! 📷");
            };
            reader.readAsDataURL(file);
        }
    };

    function showToast(message) {
        const toast = document.getElementById('toastMsg');
        if (toast) {
            toast.innerText = message;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2000);
        }
    }

    async function initWidget() {
        safeLoadLocal();
        await initFirebase();
        updateUI();
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initWidget);
    } else {
        initWidget();
    }
</script>
</body>
</html>
