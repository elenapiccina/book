<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reading Corner 📖</title>
    <style>
        :root {
            --powder-pink: #F3D7E2;
            --cream-bg: #FFF8F0;
            --text-dark: #4A3E40;
            --text-muted: #8A7A7C;
            --accent-pink: #EAA9C3;
        }

        body {
            font-family: Georgia, Cambria, "Times New Roman", Times, serif;
            background-color: transparent;
            margin: 0;
            padding: 4px;
            display: flex;
            justify-content: center;
        }

        .widget-container {
            width: 100%;
            max-width: 440px;
            background-color: var(--cream-bg);
            border: 1px solid rgba(243, 215, 226, 0.4);
            border-radius: 16px;
            padding: 16px;
            box-sizing: border-box;
            position: relative;
        }

        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .header-title {
            font-size: 1.15rem;
            font-weight: normal;
            font-style: italic;
            color: var(--text-dark);
            margin: 0;
        }

        .btn-settings-toggle {
            background: none;
            border: none;
            font-size: 1rem;
            cursor: pointer;
            opacity: 0.6;
            padding: 2px;
        }
        .btn-settings-toggle:hover { opacity: 1; }

        .book-layout-card {
            display: flex;
            gap: 14px;
            background: #ffffff;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid rgba(243, 215, 226, 0.2);
            align-items: center;
        }

        .cover-wrapper {
            width: 60px;
            height: 85px;
            background: #fcf6f8;
            border-radius: 6px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(0,0,0,0.05);
            flex-shrink: 0;
        }

        .cover-image { width: 100%; height: 100%; object-fit: cover; }
        .cover-placeholder { font-size: 1.4rem; opacity: 0.4; }

        .book-details-column {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .book-title-display {
            font-size: 1.05rem;
            font-weight: bold;
            color: var(--text-dark);
            margin: 0;
        }

        .progress-stats {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .slider {
            -webkit-appearance: none;
            width: 100%;
            height: 5px;
            border-radius: 4px;
            background: #f5f5f5;
            outline: none;
            margin: 2px 0;
        }

        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--accent-pink);
            cursor: pointer;
        }

        /* Fixed Pop-up Panel drawer */
        .overlay-settings-panel {
            display: none;
            position: absolute;
            top: 45px;
            left: 16px;
            right: 16px;
            background: #ffffff;
            border-radius: 10px;
            border: 1px solid var(--powder-pink);
            padding: 12px;
            box-shadow: 0 8px 20px rgba(74, 62, 64, 0.12);
            z-index: 10;
            flex-direction: column;
            gap: 8px;
        }

        .input-row { display: flex; gap: 6px; }
        
        input {
            border: 1px solid #ebd6da;
            border-radius: 6px;
            padding: 6px 10px;
            font-size: 0.8rem;
            font-family: inherit;
            color: var(--text-dark);
            outline: none;
            box-sizing: border-box;
        }
        .input-title { flex: 2; width: 100%; }
        .input-pages { width: 70px; text-align: center; }
        .input-url { width: 100%; }

        .btn-update {
            background: var(--accent-pink);
            color: white;
            border: none;
            border-radius: 6px;
            padding: 8px;
            font-family: inherit;
            font-size: 0.8rem;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="widget-container">
    <div class="header-row">
        <h1 class="header-title">📖 Current Read</h1>
        <button class="btn-settings-toggle" onclick="toggleSettingsPanel()">⚙️</button>
    </div>

    <div class="book-layout-card">
        <div class="cover-wrapper" id="coverContainer">
            <span class="cover-placeholder">📖</span>
        </div>
        
        <div class="book-details-column">
            <h2 class="book-title-display" id="bookTitle">Loading...</h2>
            
            <div style="display: flex; flex-direction: column; gap: 2px;">
                <div class="progress-stats">
                    <span id="pageProgress">Page 0 of 0</span>
                    <span id="percentProgress" style="font-weight: bold; color: var(--accent-pink);">0%</span>
                </div>
                <input type="range" min="0" max="100" value="0" class="slider" id="progressSlider" oninput="updateSliderProgress(this.value)">
            </div>
        </div>
    </div>

    <!-- Configuration fields window -->
    <div class="overlay-settings-panel" id="settingsPanel">
        <div class="input-row">
            <input type="text" id="newTitle" class="input-title" placeholder="Book title...">
            <input type="number" id="newPages" class="input-pages" placeholder="Pages">
        </div>
        <input type="text" id="newCoverUrl" class="input-url" placeholder="Paste Cover Image URL...">
        <button class="btn-update" onclick="changeBook()">Set New Book ➔</button>
    </div>
</div>

<script>
    let bookData = JSON.parse(localStorage.getItem('notion_book_compact_v4')) || {
        title: "Atomic Habits",
        totalPages: 368,
        currentPage: 47,
        coverUrl: ""
    };

    function renderBook() {
        localStorage.setItem('notion_book_compact_v4', JSON.stringify(bookData));
        
        document.getElementById('bookTitle').innerText = bookData.title;
        
        const slider = document.getElementById('progressSlider');
        slider.max = bookData.totalPages;
        slider.value = bookData.currentPage;

        const percent = Math.round((bookData.currentPage / bookData.totalPages) * 100) || 0;
        document.getElementById('pageProgress').innerText = `Page ${bookData.currentPage} of ${bookData.totalPages}`;
        document.getElementById('percentProgress').innerText = `${percent}%`;

        const coverContainer = document.getElementById('coverContainer');
        if (bookData.coverUrl && bookData.coverUrl.trim().startsWith('http')) {
            coverContainer.innerHTML = `<img src="${bookData.coverUrl}" class="cover-image" alt="Book Cover">`;
        } else {
            coverContainer.innerHTML = `<span class="cover-placeholder">📖</span>`;
        }
    }

    function updateSliderProgress(val) {
        bookData.currentPage = parseInt(val);
        localStorage.setItem('notion_book_compact_v4', JSON.stringify(bookData));
        
        const percent = Math.round((bookData.currentPage / bookData.totalPages) * 100) || 0;
        document.getElementById('pageProgress').innerText = `Page ${bookData.currentPage} of ${bookData.totalPages}`;
        document.getElementById('percentProgress').innerText = `${percent}%`;
    }

    function toggleSettingsPanel() {
        const panel = document.getElementById('settingsPanel');
        panel.style.display = (panel.style.display === 'flex') ? 'none' : 'flex';
    }

    function changeBook() {
        const titleIn = document.getElementById('newTitle');
        const pagesIn = document.getElementById('newPages');
        const coverIn = document.getElementById('newCoverUrl');

        if (titleIn.value.trim()) bookData.title = titleIn.value.trim();
        if (pagesIn.value && parseInt(pagesIn.value) > 0) {
            bookData.totalPages = parseInt(pagesIn.value);
            bookData.currentPage = 0; 
        }
        if (coverIn.value.trim()) {
            bookData.coverUrl = coverIn.value.trim();
        }

        titleIn.value = '';
        pagesIn.value = '';
        coverIn.value = '';
        
        toggleSettingsPanel();
        renderBook();
    }

    renderBook();
</script>

</body>
</html>
