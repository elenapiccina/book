<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reading Corner 📖</title>
    <style>
        :root {
            --powder-pink: #F8BBD0;
            --cream-bg: #FFFBF7; /* Sophisticated fine cream background */
            --text-dark: #2C2526;  /* Luxury high-contrast tone */
            --text-muted: #746264; /* Fine grey-pink shadow text */
            --accent-pink: #D4A5B8;
        }

        body {
            font-family: Garamond, Baskerville, Georgia, serif;
            background-color: transparent;
            margin: 0;
            padding: 4px;
            display: flex;
            justify-content: center;
        }

        .widget-container {
            width: 100%;
            max-width: 440px;
            background-color: var(--cream-bg);
            border: 1px solid #EFEAE4;
            border-radius: 12px;
            padding: 20px;
            box-sizing: border-box;
            position: relative;
        }

        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #F3EDE6;
            padding-bottom: 8px;
            margin-bottom: 4px;
        }

        .header-title {
            font-size: 1.1rem;
            font-weight: normal;
            font-style: italic;
            letter-spacing: 0.8px;
            color: var(--text-dark);
            margin: 0;
            text-transform: lowercase;
        }

        /* Clean Date display text line block matching the serif aesthetic */
        .date-line {
            font-family: inherit;
            font-size: 0.8rem;
            font-style: italic;
            color: var(--text-muted);
            letter-spacing: 0.5px;
            margin-bottom: 16px;
            opacity: 0.8;
        }

        .btn-settings-toggle {
            background: none;
            border: none;
            font-size: 0.9rem;
            color: var(--text-muted);
            cursor: pointer;
            opacity: 0.5;
            padding: 2px;
            transition: opacity 0.2s;
        }
        .btn-settings-toggle:hover { opacity: 1; }

        .book-layout-card {
            display: flex;
            gap: 18px;
            align-items: flex-start;
        }

        .cover-wrapper {
            width: 64px;
            height: 96px;
            background: #FDFBFA;
            border-radius: 4px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #EAE3DA;
            flex-shrink: 0;
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
        }

        .cover-image { width: 100%; height: 100%; object-fit: cover; }
        .cover-placeholder { font-size: 1.2rem; opacity: 0.3; }

        .book-details-column {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-top: 2px;
        }

        .book-title-display {
            font-size: 1.2rem;
            font-weight: normal;
            letter-spacing: 0.3px;
            color: var(--text-dark);
            margin: 0;
        }

        .progress-stats {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            font-style: italic;
            color: var(--text-muted);
            letter-spacing: 0.2px;
        }

        /* High-End Needle Slider Bar */
        .slider {
            -webkit-appearance: none;
            width: 100%;
            height: 2px; /* Ultra thin luxury timeline line */
            background: #EAE3DA;
            outline: none;
            margin: 6px 0;
        }

        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--text-dark); /* Sophisticated sharp marker */
            cursor: pointer;
            transition: transform 0.1s;
        }
        .slider::-webkit-slider-thumb:hover {
            transform: scale(1.2);
            background: var(--accent-pink);
        }

        /* Elegant Dropdown Drawer Settings Panel */
        .overlay-settings-panel {
            display: none;
            position: absolute;
            top: 48px;
            left: 20px;
            right: 20px;
            background: #ffffff;
            border-radius: 8px;
            border: 1px solid #EFEAE4;
            padding: 14px;
            box-shadow: 0 10px 25px rgba(44, 37, 38, 0.08);
            z-index: 10;
            flex-direction: column;
            gap: 8px;
        }

        .input-row { display: flex; gap: 6px; }
        
        input {
            border: 1px solid #EAE3DA;
            border-radius: 4px;
            padding: 6px 10px;
            font-size: 0.8rem;
            font-family: inherit;
            color: var(--text-dark);
            outline: none;
            background: #FDFBFA;
            box-sizing: border-box;
        }
        input::placeholder { font-style: italic; color: #BBB0B2; }
        .input-title { flex: 2; width: 100%; }
        .input-pages { width: 70px; text-align: center; }
        .input-url { width: 100%; }

        .btn-update {
            background: var(--text-dark);
            color: #ffffff;
            border: none;
            border-radius: 4px;
            padding: 8px;
            font-family: inherit;
            font-size: 0.8rem;
            letter-spacing: 0.5px;
            font-weight: normal;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-update:hover { background: var(--accent-pink); }
    </style>
</head>
<body>

<div class="widget-container">
    <div class="header-row">
        <h1 class="header-title">currently reading</h1>
        <button class="btn-settings-toggle" onclick="toggleSettingsPanel()">✍︎ edit</button>
    </div>
    <!-- The new live date placeholder -->
    <div class="date-line" id="liveDate">loading date...</div>

    <div class="book-layout-card">
        <div class="cover-wrapper" id="coverContainer">
            <span class="cover-placeholder">📖</span>
        </div>
        
        <div class="book-details-column">
            <h2 class="book-title-display" id="bookTitle">Loading...</h2>
            
            <div style="display: flex; flex-direction: column; gap: 2px;">
                <div class="progress-stats">
                    <span id="pageProgress">page 0 of 0</span>
                    <span id="percentProgress" style="color: var(--text-dark); font-weight: bold;">0%</span>
                </div>
                <input type="range" min="0" max="100" value="0" class="slider" id="progressSlider" oninput="updateSliderProgress(this.value)">
            </div>
        </div>
    </div>

    <!-- Edit Settings Overlay Drawer -->
    <div class="overlay-settings-panel" id="settingsPanel">
        <div class="input-row">
            <input type="text" id="newTitle" class="input-title" placeholder="Book title...">
            <input type="number" id="newPages" class="input-pages" placeholder="Pages">
        </div>
        <input type="text" id="newCoverUrl" class="input-url" placeholder="Paste image link URL...">
        <button class="btn-update" onclick="changeBook()">Update Library ➔</button>
    </div>
</div>

<script>
    let bookData = JSON.parse(localStorage.getItem('notion_book_editorial_v7')) || {
        title: "Atomic Habits",
        totalPages: 368,
        currentPage: 47,
        coverUrl: ""
    };

    function setLiveDate() {
        const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        const today = new Date();
        document.getElementById('liveDate').innerText = today.toLocaleDateString('en-US', options).toLowerCase();
    }

    function renderBook() {
        localStorage.setItem('notion_book_editorial_v7', JSON.stringify(bookData));
        
        document.getElementById('bookTitle').innerText = bookData.title;
        
        const slider = document.getElementById('progressSlider');
        slider.max = bookData.totalPages;
        slider.value = bookData.currentPage;

        const percent = Math.round((bookData.currentPage / bookData.totalPages) * 100) || 0;
        document.getElementById('pageProgress').innerText = `page ${bookData.currentPage} of ${bookData.totalPages}`;
        document.getElementById('percentProgress').innerText = `${percent}%`;

        const coverContainer = document.getElementById('coverContainer');
        if (bookData.coverUrl && bookData.coverUrl.trim().startsWith('http')) {
            coverContainer.innerHTML = `<img src="${bookData.coverUrl}" class="cover-image" alt="Book Cover">`;
        } else {
            coverContainer.innerHTML = `<span class="cover-placeholder">📖</span>`;
        }
    }

    function updateSliderProgress(val) {
        bookData.currentPage = parseInt(val);
        localStorage.setItem('notion_book_editorial_v7', JSON.stringify(bookData));
        
        const percent = Math.round((bookData.currentPage / bookData.totalPages) * 100) || 0;
        document.getElementById('pageProgress').innerText = `page ${bookData.currentPage} of ${bookData.totalPages}`;
        document.getElementById('percentProgress').innerText = `${percent}%`;
    }

    function toggleSettingsPanel() {
        const panel = document.getElementById('settingsPanel');
        panel.style.display = (panel.style.display === 'flex') ? 'none' : 'flex';
    }

    function changeBook() {
        const titleIn = document.getElementById('newTitle');
        const pagesIn = document.getElementById('newPages');
        const coverIn = document.getElementById('newCoverUrl');

        if (titleIn.value.trim()) bookData.title = titleIn.value.trim();
