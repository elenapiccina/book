<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reading Corner 📖</title>
    <style>
        :root {
            --powder-pink: #F3D7E2;
            --cream-bg: #FFF8F0;
            --text-dark: #36302C;
            --text-muted: #8A7A7C;
            --accent-pink: #EAA9C3;
        }

        body {
            font-family: Georgia, Cambria, "Times New Roman", Times, serif;
            background-color: transparent;
            margin: 0;
            padding: 8px;
            display: flex;
            justify-content: center;
        }

        .widget-container {
            width: 100%;
            max-width: 480px;
            background-color: var(--cream-bg);
            border: 1px solid rgba(243, 215, 226, 0.4);
            border-radius: 20px;
            padding: 24px;
            box-sizing: border-box;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.01);
            position: relative;
        }

        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }

        .header-title {
            font-size: 1.4rem;
            font-weight: normal;
            font-style: italic;
            color: var(--text-dark);
            margin: 0;
            flex-grow: 1;
            text-align: center;
            padding-left: 28px;
        }

        /* Clean Date display text line block */
        .date-line {
            font-family: inherit;
            font-size: 0.85rem;
            font-style: italic;
            color: var(--text-muted);
            letter-spacing: 0.3px;
            margin-bottom: 20px;
            text-align: center;
            opacity: 0.8;
        }

        .btn-settings-toggle {
            background: none;
            border: none;
            font-size: 1.1rem;
            cursor: pointer;
            opacity: 0.6;
            padding: 4px;
        }
        .btn-settings-toggle:hover { opacity: 1; }

        .timer-box {
            background-color: #ffffff;
            border-radius: 12px;
            padding: 12px;
            text-align: center;
            border: 1px solid rgba(243, 215, 226, 0.3);
            margin-bottom: 20px;
        }

        .timer-title {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .timer-display {
            font-size: 1.4rem;
            font-weight: bold;
            color: var(--text-dark);
            margin-bottom: 8px;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        }

        .btn-timer {
            background-color: var(--powder-pink);
            border: none;
            border-radius: 8px;
            padding: 6px 16px;
            font-family: inherit;
            font-size: 0.85rem;
            color: var(--text-dark);
            cursor: pointer;
            font-weight: bold;
        }
        .btn-timer.active { background-color: var(--accent-pink); color: white; }

        .book-layout-card {
            display: flex;
            gap: 20px;
            background: #ffffff;
            padding: 16px;
            border-radius: 12px;
            border: 1px solid rgba(243, 215, 226, 0.2);
            align-items: center;
        }

        .cover-wrapper {
            width: 80px;
            height: 115px;
            background: #fcf6f8;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(0,0,0,0.05);
            flex-shrink: 0;
        }

        .cover-image { width: 100%; height: 100%; object-fit: cover; }
        .cover-placeholder { font-size: 1.8rem; opacity: 0.4; }

        .book-details-column {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .book-title-display {
            font-size: 1.15rem;
            font-weight: bold;
            color: var(--text-dark);
            margin: 0;
        }

        .progress-stats {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .slider {
            -webkit-appearance: none;
            width: 100%;
            height: 6px;
            border-radius: 4px;
            background: #f5f5f5;
            outline: none;
            margin: 4px 0;
        }

        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--accent-pink);
            cursor: pointer;
        }

        .overlay-settings-panel {
            display: none;
            position: absolute;
            top: 60px;
            left: 24px;
            right: 24px;
            background: #ffffff;
            border-radius: 14px;
            border: 1px solid var(--powder-pink);
            padding: 16px;
            box-shadow: 0 10px 25px rgba(74, 62, 64, 0.15);
            z-index: 10;
            flex-direction: column;
            gap: 10px;
        }

        .input-row { display: flex; gap: 8px; }
        
        input {
            border: 1px solid #ebd6da;
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 0.85rem;
            font-family: inherit;
            color: var(--text-dark);
            outline: none;
            box-sizing: border-box;
        }
        .input-title { flex: 2; width: 100%; }
        .input-pages { width: 80px; text-align: center; }
        .input-url { width: 100%; }

        .btn-update {
            background: var(--accent-pink);
            border: none;
            border-radius: 8px;
            padding: 8px;
            font-family: inherit;
            font-size: 0.85rem;
            font-weight: bold;
            color: white;
            cursor: pointer;
            margin-top: 4px;
        }
    </style>
</head>
<body>

<div class="widget-container">
    <div class="header-row">
        <h1 class="header-title">📖 Current Reading</h1>
        <button class="btn-settings-toggle" onclick="toggleSettingsPanel()">⚙️</button>
    </div>
    <!-- Live date updates automatically via Javascript -->
    <div class="date-line" id="liveDate">loading date...</div>

    <div class="timer-box">
        <div class="timer-title">⏱️ Reading Focus Session</div>
        <div class="timer-display" id="timeDisplay">00:00</div>
        <button class="btn-timer" id="timerBtn" onclick="toggleTimer()">Start Session</button>
    </div>

    <div class="book-layout-card">
        <div class="cover-wrapper" id="coverContainer">
            <span class="cover-placeholder">📖</span>
        </div>
        
        <div class="book-details-column">
            <h2 class="book-title-display" id="bookTitle">Loading...</h2>
            
            <div style="display: flex; flex-direction: column; gap: 4px;">
                <div class="progress-stats">
                    <span id="pageProgress">Page 0 of 0</span>
                    <span id="percentProgress" style="font-weight: bold; color: var(--accent-pink);">0%</span>
                </div>
                <input type="range" min="0" max="100" value="0" class="slider" id="progressSlider" oninput="updateSliderProgress(this.value)">
            </div>
        </div>
    </div>

    <div class="overlay-settings-panel" id="settingsPanel">
        <div style="font-size: 0.85rem; font-weight: bold; color: var(--text-dark); margin-bottom: 4px;">Configure Book Details</div>
        <div class="input-row">
            <input type="text" id="newTitle" class="input-title" placeholder="Book title...">
            <input type="number" id="newPages" class="input-pages" placeholder="Pages">
        </div>
        <input type="text" id="newCoverUrl" class="input-url" placeholder="Paste Cover Image URL here...">
        <button class="btn-update" onclick="changeBook()">Apply Config ➔</button>
    </div>
</div>

<script>
    let bookData = JSON.parse(localStorage.getItem('notion_book_popup_restored')) || {
        title: "Atomic Habits",
        totalPages: 368,
        currentPage: 47,
        coverUrl: ""
    };

    let timerSeconds = 0;
    let timerInterval = null;
    let isTimerRunning = false;

    function setLiveDate() {
        const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        const today = new Date();
        document.getElementById('liveDate').innerText = today.toLocaleDateString('en-US', options);
    }

    function renderBook() {
        localStorage.setItem('notion_book_popup_restored', JSON.stringify(bookData));
        
        document.getElementById('bookTitle').innerText = bookData.title;
        
        const slider = document.getElementById('progressSlider');
        slider.max = bookData.totalPages;
        slider.value = bookData.currentPage;

        const percent = Math.round((bookData.currentPage / bookData.totalPages) * 100) || 0;
        document.getElementById('pageProgress').innerText = `Page ${bookData.currentPage} of ${bookData.totalPages}`;
        document.getElementById('percentProgress').innerText = `${percent}%`;

        const coverContainer = document.getElementById('coverContainer');
        if (bookData.coverUrl && bookData.coverUrl.trim().startsWith('http')) {
            coverContainer.innerHTML = `<img src="${bookData.coverUrl}" class="cover-image" alt="Book Cover">`;
        } else {
            coverContainer.innerHTML = `<span class="cover-placeholder">📖</span>`;
        }
    }

    function updateSliderProgress(val) {
        bookData.currentPage = parseInt(val);
